<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Icono de El Atril (32 px o mas). Para 16-24 px se usa icono_pequeno.svg.
     Se convierte a app/web/icono.ico (16 a 256 px, fondo transparente). -->
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b3f7a"/><stop offset=".45" stop-color="#4f8fe6"/><stop offset="1" stop-color="#173a72"/></linearGradient>
<linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a9cf0"/><stop offset="1" stop-color="#1a4590"/></linearGradient>
<linearGradient id="papel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe7f2"/></linearGradient>
<linearGradient id="azul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cb3ff"/><stop offset="1" stop-color="#1a5fd0"/></linearGradient>
<linearGradient id="naranja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e8740c"/></linearGradient>
<linearGradient id="verde" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe07a"/><stop offset="1" stop-color="#16963a"/></linearGradient>
<linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="sombra" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="sombraS" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<g filter="url(#sombra)">
 <!-- patas y barra -->
 <path d="M128 176 L52 248" stroke="url(#metalV)" stroke-width="14" stroke-linecap="round"/>
 <path d="M128 176 L204 248" stroke="url(#metalV)" stroke-width="14" stroke-linecap="round"/>
 <rect x="118" y="160" width="20" height="92" rx="7" fill="url(#metal)"/>
 <!-- tablero -->
 <path d="M20 14 Q20 4 30 4 H226 Q236 4 236 14 L246 162 Q246 176 232 176 H24 Q10 176 10 162Z" fill="url(#metalV)"/>
 <path d="M30 4 H226 Q236 4 236 14 L237 30 H19 L20 14 Q20 4 30 4Z" fill="url(#brillo)"/>
 <!-- hoja con simbolos de Markdown -->
 <path d="M38 16 H218 L228 160 H28 Z" fill="url(#papel)" filter="url(#sombraS)"/>
 <text x="40" y="72" font-size="62" font-family="Segoe UI, Arial" font-weight="900" fill="url(#azul)">#</text>
 <rect x="90" y="38" width="120" height="22" rx="11" fill="url(#azul)"/>
 <text x="38" y="124" font-size="50" font-family="Segoe UI, Arial" font-weight="900" fill="url(#naranja)">**</text>
 <rect x="90" y="90" width="122" height="13" rx="6.5" fill="#9aa8bb"/>
 <rect x="90" y="110" width="96" height="13" rx="6.5" fill="#9aa8bb"/>
 <text x="42" y="150" font-size="40" font-family="Segoe UI, Arial" font-weight="900" fill="url(#verde)">&gt;</text>
 <rect x="90" y="130" width="128" height="13" rx="6.5" fill="#9aa8bb"/>
 <!-- repisa -->
 <rect x="8" y="152" width="240" height="26" rx="10" fill="url(#metal)"/>
 <rect x="14" y="154" width="228" height="8" rx="4" fill="url(#brillo)"/>
</g>
</svg>
